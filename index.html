<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14161a" />
  <meta name="description" content="Parametrische Bauteile für den 3D-Druck: Maße eingeben, 3D-Vorschau ansehen, STL herunterladen." />
  <title>Teile-Generator</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> Teile-Generator</div>
    <div class="bed">
      <label for="printer">Drucker</label>
      <select id="printer"></select>
      <span id="custom" class="custom" hidden>
        <input id="bedW" type="number" min="50" max="1000" step="1" inputmode="numeric" aria-label="Breite" />×
        <input id="bedD" type="number" min="50" max="1000" step="1" inputmode="numeric" aria-label="Tiefe" />×
        <input id="bedH" type="number" min="20" max="1000" step="1" inputmode="numeric" aria-label="Höhe" /> mm
      </span>
    </div>
  </header>
  <main class="layout">
    <section class="viewer" id="viewer">
      <div class="overlay top">
        <span id="dims">…</span>
      </div>
      <div class="overlay bottom">
        <button id="fit" class="ghost" title="Ansicht zurücksetzen">⤢ Ansicht</button>
        <button id="wire" class="ghost" title="Kanten anzeigen">◇ Kanten</button>
      </div>
      <div id="busy" class="busy" hidden>rechnet…</div>
    </section>
    <aside class="panel">
      <nav id="chooser" class="chooser" aria-label="Bauteil wählen"></nav>
      <div class="card">
        <h1 id="pname"></h1>
        <p id="pdesc" class="muted"></p>
        <form id="form" class="form" autocomplete="off"></form>
      </div>
      <div class="card stats" id="stats"></div>
      <div id="msgs"></div>
      <div class="actions">
        <button id="dl3mf" class="primary">⬇ 3MF für Bambu Studio</button>
        <button id="dl" class="ghost">⬇ STL herunterladen</button>
        <div class="row">
          <button id="share" class="ghost">🔗 Link kopieren</button>
          <button id="reset" class="ghost">↺ Standardwerte</button>
        </div>
      </div>
      <footer class="muted small">Alles läuft lokal im Browser. Maße in mm. Gridfinity ist ein offener Standard (MIT).</footer>
    </aside>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
